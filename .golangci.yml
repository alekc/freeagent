version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - usestdlibvars
    - wastedassign
  settings:
    revive:
      rules:
        - name: exported
          severity: warning
    gosec:
      excludes:
        # G104 duplicates errcheck, which is already on by default.
        - G104
  exclusions:
    rules:
      # Test servers write with fmt.Fprint and never usefully fail; the
      # assertions, not the write, are what the test is checking.
      - path: _test\.go$
        linters:
          - errcheck
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/alekc/freeagent-sdk
