name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  # actions/setup-go pins GOTOOLCHAIN=local, which makes the go.mod toolchain
  # directive a hard error instead of a download. Force auto so the matrix
  # version is what actually runs.
  GOTOOLCHAIN: auto

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Greenfield, so it tracks the current release rather than carrying
        # compatibility weight. The models use new(expr), which is 1.26.
        go: ["1.26.x"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - run: go build ./...
      - run: go test -race -count=1 -coverprofile=coverage.txt -covermode=atomic ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.txt | tail -n 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      # Must be built with a Go at least as new as the module's directive, or
      # it refuses to load the config.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - run: go mod tidy
      - name: Fail if go.mod or go.sum changed
        run: git diff --exit-code -- go.mod go.sum
